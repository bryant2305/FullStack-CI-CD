name: CI Pipeline

on:
  pull_request:

defaults:
  run:
    working-directory: codebase/rdicidr-0.1.0

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Install dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

  test:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run tests
        env:
          CI: true
        run: npm run test

  build:
    needs: [lint,test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Build project
        run: npm run build
